[project]
name = "points-posting-investigator"
version = "0.1.0"
description = "Stage 10 of a simulated hotel-group engagement: an event-driven points-posting pipeline, an alert-triggered read-only AI incident investigator, and human-approved recovery, benchmarked against manual and rules-only investigation. Synthetic data."
readme = "README.md"
license = "MIT"
authors = [{ name = "Vamsi Alla" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic~=1.20.1",
    "confluent-kafka[avro,schemaregistry]~=2.16.1",
    "fastapi~=0.162.0",
    "httpx~=0.28.1",
    "prometheus-client~=0.26.0",
    "psycopg[binary]~=3.3.6",
    "pydantic~=2.14.1",
    "python-dotenv~=1.2.4",
    "pyyaml~=6.0.3",
    "sqlalchemy~=2.1.6",
    "uvicorn~=0.54.0",
]

[dependency-groups]
dev = [
    "mypy~=2.4.1",
    "pre-commit~=4.7.0",
    "pytest~=9.2.0",
    "pytest-cov~=7.1.0",
    "ruff~=0.17.3",
    "types-pyyaml~=6.0.12",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is how pytest checks

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S603", "S607", "S608"]  # fake secrets, seeded randomness, git calls, fixed SQL
"app/env_leaks.py" = ["S603", "S607"]  # runs `git ls-files`

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p pytester"
markers = [
    "postgres: needs a real PostgreSQL (TEST_DATABASE_URL); skipped with the reason if absent, a failure under REQUIRE_MARKERS",
    "kafka: needs a real Kafka broker (TEST_KAFKA_BOOTSTRAP_SERVERS); skipped with the reason if absent, a failure under REQUIRE_MARKERS",
    "chaos: stops and restarts a stack container (Kafka) to test an outage; always also marked kafka",
    "batch: the slow failure scenarios on the real stack (restarts, outages, a rebalance storm); always also marked postgres and kafka; run by scripts/run_integration.py --batch and the Scenario batch workflow",
    "browser: drives Chromium with Playwright; skipped with the reason if absent, a failure under REQUIRE_MARKERS",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests/required_markers.py"]
