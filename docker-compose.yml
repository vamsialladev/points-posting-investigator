# The local stack (RFC-0001). Simulated systems, synthetic data, local only: every port binds to 127.0.0.1.
#
#   docker compose --profile core up -d --build --wait     # scripts\stack.ps1 up
#   docker compose --profile core down                     # scripts\stack.ps1 down   (-v also deletes the data)
#
# Values come from .env (scripts\new_env.ps1 makes it; nothing is printed). Compose refuses to start without the
# required ones (the `:?` lines). Profiles: core now; observability (M4) and full later.
name: points-posting

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-app: &app
  build: .
  image: points-posting-app:local
  profiles: [core, full]
  read_only: true
  tmpfs: [/tmp]
  <<: *hardening

services:
  db:
    image: postgres:16.15-alpine
    profiles: [core, full]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-points}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-points}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: during first-start init the server listens on the socket only (Stage 9 lesson).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      timeout: 3s
      interval: 30s  # slow once healthy: each probe starts a process (Kafka: a JVM)
      start_interval: 2s  # fast while starting, so `up --wait` is still quick
      start_period: 120s
      retries: 3
    # The entrypoint starts as root, fixes the data folder's owner, then drops to the postgres user.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]

  kafka:
    image: apache/kafka:4.4.0
    profiles: [core, full]
    environment:
      CLUSTER_ID: hg-demo-points-local-1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092,FAULTS://:19093
      # 127.0.0.1, not localhost: on Windows a client given "localhost" tries ::1 first and waits 2 s for it to fail
      # (measured in M2 PR-B1; same cause as ADR-0012). The stack binds IPv4 only.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:${KAFKA_HOST_PORT:-9092},FAULTS://127.0.0.1:19092
      # FAULTS (tests only): advertised as 127.0.0.1:19092, where tests/kafka_proxy.py listens and forwards to this
      # listener (host port 19093), dropping replies on demand to force producer retries (ADR-0017).
      # Every listener a client can reach asks for a login (SASL/PLAIN), and the broker refuses whatever the access
      # list doesn't allow (ADR-0021; the list is app/pipeline/kafka_auth.py, applied by kafka-init). No TLS: the
      # stack is local and binds loopback only. The controller listener stays plain, as in Apache Kafka's own
      # single-node example; it isn't published to the host, and its ANONYMOUS principal is the broker itself.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,FAULTS:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: &kafka-users >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin"
        password="${KAFKA_ADMIN_PASSWORD:?set KAFKA_ADMIN_PASSWORD in .env (scripts\new_env.ps1 -AddMissing)}"
        user_admin="${KAFKA_ADMIN_PASSWORD}"
        user_producer="${KAFKA_PRODUCER_PASSWORD:?set KAFKA_PRODUCER_PASSWORD in .env (scripts\new_env.ps1 -AddMissing)}"
        user_posting="${KAFKA_POSTING_PASSWORD:?set KAFKA_POSTING_PASSWORD in .env (scripts\new_env.ps1 -AddMissing)}"
        user_relay="${KAFKA_RELAY_PASSWORD:?set KAFKA_RELAY_PASSWORD in .env (scripts\new_env.ps1 -AddMissing)}"
        user_registry="${KAFKA_REGISTRY_PASSWORD:?set KAFKA_REGISTRY_PASSWORD in .env (scripts\new_env.ps1 -AddMissing)}"
        user_investigator="${KAFKA_INVESTIGATOR_PASSWORD:?set KAFKA_INVESTIGATOR_PASSWORD in .env (scripts\new_env.ps1 -AddMissing)}"
        user_replayer="${KAFKA_REPLAYER_PASSWORD:?set KAFKA_REPLAYER_PASSWORD in .env (scripts\new_env.ps1 -AddMissing)}";
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: *kafka-users
      KAFKA_LISTENER_NAME_FAULTS_PLAIN_SASL_JAAS_CONFIG: *kafka-users
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:admin;User:ANONYMOUS
      BROKER_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD}  # for the health check below; not a broker setting
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"  # topics come from app/pipeline/topics.py only
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"  # RFC-0001 D1: fits Docker Desktop
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
      - "127.0.0.1:19093:19093"  # the FAULTS listener, reached through the test proxy on 19092
    healthcheck:
      # Logs in as the admin, so "healthy" means the broker accepts a login, not only that a port is open.
      test:
        - CMD-SHELL
        - >-
          printf 'security.protocol=SASL_PLAINTEXT\nsasl.mechanism=PLAIN\nsasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="%s";\n' "$$BROKER_ADMIN_PASSWORD" > /tmp/health.properties
          && /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 --command-config /tmp/health.properties > /dev/null 2>&1
      timeout: 15s
      interval: 30s  # slow once healthy: each probe starts a process (Kafka: a JVM)
      start_interval: 2s  # fast while starting, so `up --wait` is still quick
      start_period: 120s
      retries: 3
    <<: *hardening

  schema-registry:
    image: ghcr.io/aiven-open/karapace:6.2.4
    profiles: [core, full]
    entrypoint: [python3, -m, karapace]
    environment:
      KARAPACE_KARAPACE_REGISTRY: "true"
      KARAPACE_BOOTSTRAP_URI: kafka:29092
      KARAPACE_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KARAPACE_SASL_MECHANISM: PLAIN
      KARAPACE_SASL_PLAIN_USERNAME: registry
      KARAPACE_SASL_PLAIN_PASSWORD: ${KAFKA_REGISTRY_PASSWORD:?set KAFKA_REGISTRY_PASSWORD in .env (scripts\new_env.ps1 -AddMissing)}
      KARAPACE_HOST: 0.0.0.0
      KARAPACE_PORT: 8081
      KARAPACE_ADVERTISED_HOSTNAME: schema-registry
      KARAPACE_ADVERTISED_PROTOCOL: http
      KARAPACE_CLIENT_ID: karapace-local-1
      KARAPACE_GROUP_ID: karapace-local
      KARAPACE_MASTER_ELIGIBILITY: "true"
      KARAPACE_TOPIC_NAME: _schemas
      KARAPACE_COMPATIBILITY: BACKWARD_TRANSITIVE  # RFC-0001 D4
      KARAPACE_LOG_LEVEL: WARNING
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SCHEMA_REGISTRY_HOST_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/subjects', timeout=3)"]
      timeout: 5s
      interval: 30s  # slow once healthy: each probe starts a process (Kafka: a JVM)
      start_interval: 2s  # fast while starting, so `up --wait` is still quick
      start_period: 120s
      retries: 3
    <<: *hardening

  db-init:
    <<: *app
    command: [python, -m, app.db.bootstrap]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-points}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-points}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?set LEDGER_DB_PASSWORD in .env (scripts\new_env.ps1 -AddMissing)}
      POSTING_DB_PASSWORD: ${POSTING_DB_PASSWORD:?set POSTING_DB_PASSWORD in .env (scripts\new_env.ps1 -AddMissing)}
      RELAY_DB_PASSWORD: ${RELAY_DB_PASSWORD:?set RELAY_DB_PASSWORD in .env (scripts\new_env.ps1 -AddMissing)}
      OPS_DB_PASSWORD: ${OPS_DB_PASSWORD:?set OPS_DB_PASSWORD in .env (scripts\new_env.ps1 -AddMissing)}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  kafka-init:
    <<: *app
    command: [python, -m, app.pipeline.topics]  # creates the topics, then applies the access list
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:?set KAFKA_ADMIN_PASSWORD in .env (scripts\new_env.ps1 -AddMissing)}
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  ledger:
    <<: *app
    command: [python, -m, app.ledger]
    environment:
      LEDGER_API_TOKEN: ${LEDGER_API_TOKEN:?set LEDGER_API_TOKEN in .env}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?set LEDGER_DB_PASSWORD in .env (scripts\new_env.ps1 -AddMissing)}
      OPS_DB_PASSWORD: ${OPS_DB_PASSWORD:?set OPS_DB_PASSWORD in .env (scripts\new_env.ps1 -AddMissing)}
      POSTGRES_HOST: db
      LEDGER_HOST: 0.0.0.0
      LEDGER_CONTROL_ENABLED: "true"  # local stack only; PUBLIC_DEMO_MODE=true turns it off
      PUBLIC_DEMO_MODE: ${PUBLIC_DEMO_MODE:-false}
    ports:
      - "127.0.0.1:${LEDGER_HOST_PORT:-8020}:8020"
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully  # the stack is "up" only once the topics exist
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8020/readyz', timeout=3)"]
      timeout: 5s
      interval: 30s  # slow once healthy: each probe starts a process (Kafka: a JVM)
      start_interval: 2s  # fast while starting, so `up --wait` is still quick
      start_period: 120s
      retries: 3
    restart: unless-stopped

  posting:
    <<: *app
    command: [python, -m, app.pipeline.posting]
    environment:
      POSTING_DB_PASSWORD: ${POSTING_DB_PASSWORD:?set POSTING_DB_PASSWORD in .env (scripts\new_env.ps1 -AddMissing)}
      OPS_DB_PASSWORD: ${OPS_DB_PASSWORD:?set OPS_DB_PASSWORD in .env (scripts\new_env.ps1 -AddMissing)}
      POSTGRES_HOST: db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_POSTING_PASSWORD: ${KAFKA_POSTING_PASSWORD:?set KAFKA_POSTING_PASSWORD in .env (scripts\new_env.ps1 -AddMissing)}
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      LEDGER_API_URL: http://ledger:8020
      LEDGER_TIMEOUT_SECONDS: ${LEDGER_TIMEOUT_SECONDS:-5.0}  # scenario S12 lowers it (RFC-0002)
      LEDGER_API_TOKEN: ${LEDGER_API_TOKEN:?set LEDGER_API_TOKEN in .env}
      POSTING_METRICS_HOST: 0.0.0.0
      POSTING_METRICS_PORT: 9109
    ports:
      - "127.0.0.1:${POSTING_METRICS_HOST_PORT:-9109}:9109"
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
      ledger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9109/metrics', timeout=3)"]
      timeout: 5s
      interval: 30s  # slow once healthy: each probe starts a process (Kafka: a JVM)
      start_interval: 2s  # fast while starting, so `up --wait` is still quick
      start_period: 120s
      retries: 3
    stop_grace_period: 20s  # SIGTERM: finish the message, commit its offset, close
    restart: unless-stopped

  retry-worker:
    <<: *app
    command: [python, -m, app.pipeline.retry]
    environment:
      POSTING_DB_PASSWORD: ${POSTING_DB_PASSWORD:?set POSTING_DB_PASSWORD in .env (scripts\new_env.ps1 -AddMissing)}
      OPS_DB_PASSWORD: ${OPS_DB_PASSWORD:?set OPS_DB_PASSWORD in .env (scripts\new_env.ps1 -AddMissing)}
      POSTGRES_HOST: db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_POSTING_PASSWORD: ${KAFKA_POSTING_PASSWORD:?set KAFKA_POSTING_PASSWORD in .env (scripts\new_env.ps1 -AddMissing)}
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      LEDGER_API_URL: http://ledger:8020
      LEDGER_TIMEOUT_SECONDS: ${LEDGER_TIMEOUT_SECONDS:-5.0}  # scenario S12 lowers it (RFC-0002)
      LEDGER_API_TOKEN: ${LEDGER_API_TOKEN:?set LEDGER_API_TOKEN in .env}
      RETRY_WORKER_ID: retry-1
      RETRY_METRICS_HOST: 0.0.0.0
      RETRY_METRICS_PORT: 9110
    ports:
      - "127.0.0.1:${RETRY_METRICS_HOST_PORT:-9110}:9110"
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
      ledger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9110/metrics', timeout=3)"]
      timeout: 5s
      interval: 30s  # slow once healthy: each probe starts a process (Kafka: a JVM)
      start_interval: 2s  # fast while starting, so `up --wait` is still quick
      start_period: 120s
      retries: 3
    stop_grace_period: 20s  # SIGTERM: finish the cycle, then exit
    restart: unless-stopped

  relay:
    <<: *app
    command: [python, -m, app.pipeline.relay]
    environment:
      RELAY_DB_PASSWORD: ${RELAY_DB_PASSWORD:?set RELAY_DB_PASSWORD in .env (scripts\new_env.ps1 -AddMissing)}
      OPS_DB_PASSWORD: ${OPS_DB_PASSWORD:?set OPS_DB_PASSWORD in .env (scripts\new_env.ps1 -AddMissing)}
      POSTGRES_HOST: db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_RELAY_PASSWORD: ${KAFKA_RELAY_PASSWORD:?set KAFKA_RELAY_PASSWORD in .env (scripts\new_env.ps1 -AddMissing)}
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      RELAY_ID: relay-1
      RELAY_METRICS_HOST: 0.0.0.0
      RELAY_METRICS_PORT: 9108
    ports:
      - "127.0.0.1:${RELAY_METRICS_HOST_PORT:-9108}:9108"
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9108/metrics', timeout=3)"]
      timeout: 5s
      interval: 30s  # slow once healthy: each probe starts a process (Kafka: a JVM)
      start_interval: 2s  # fast while starting, so `up --wait` is still quick
      start_period: 120s
      retries: 3
    stop_grace_period: 20s  # SIGTERM: finish the cycle, flush, exit
    restart: unless-stopped

volumes:
  pgdata:
