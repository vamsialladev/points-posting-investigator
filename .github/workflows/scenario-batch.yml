# The slow failure scenarios on a real stack, in GitHub Actions instead of on the owner's laptop (RFC-0002 Phase 2).
# S03, S04, S06 to S10, S12, S14, S15 (both pairs), S17 and S18: each is triggered against the containerised services,
# checked, and reset. Synthetic data, no API key, no paid service, no secret stored in GitHub: every value below is a
# throwaway generated for this run's own containers and masked in the log.
#
# This workflow is NOT a required check: the required CI job runs the six fast scenarios on every pull request. It
# runs when the scenario code changes, and on demand. The same tests run locally with:
#   scripts\stack.ps1 up, then scripts\test_integration.ps1 --batch
name: Scenario batch

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/scenarios/**"
      - "app/ops/**"
      - "app/pipeline/**"
      - "app/ledger/**"
      - "ops/**"
      - "migrations/**"
      - "tests/test_scenarios_batch.py"
      - "tests/test_scenarios_real.py"
      - "docker-compose.yml"
      - "Dockerfile"
      - ".github/workflows/scenario-batch.yml"

permissions:
  contents: read

concurrency:
  group: scenario-batch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  batch:
    name: Twelve slow scenarios on a real stack
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Throwaway local values for this run (masked)
        run: |
          for name in POSTGRES_PASSWORD LEDGER_DB_PASSWORD POSTING_DB_PASSWORD RELAY_DB_PASSWORD OPS_DB_PASSWORD LEDGER_API_TOKEN KAFKA_ADMIN_PASSWORD KAFKA_PRODUCER_PASSWORD KAFKA_POSTING_PASSWORD KAFKA_RELAY_PASSWORD KAFKA_REGISTRY_PASSWORD KAFKA_INVESTIGATOR_PASSWORD KAFKA_REPLAYER_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Start the core stack (compose --wait fails if any service is unhealthy)
        run: docker compose --profile core up -d --build --wait --wait-timeout 300
      - name: The scenario batch, one scenario at a time (a skipped or missing test fails the job)
        run: uv run python scripts/run_integration.py --batch -v -s
        env:
          TEST_DATABASE_URL: postgresql+psycopg://points:${{ env.POSTGRES_PASSWORD }}@127.0.0.1:5432/points
          TEST_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
          TEST_SCHEMA_REGISTRY_URL: http://127.0.0.1:8081
          TEST_LEDGER_URL: http://127.0.0.1:8020
          TEST_LEDGER_TOKEN: ${{ env.LEDGER_API_TOKEN }}
          TEST_POSTING_DB_PASSWORD: ${{ env.POSTING_DB_PASSWORD }}
          TEST_RELAY_METRICS_URL: http://127.0.0.1:9108/metrics
      - name: Stack logs (always, for the evidence)
        if: always()
        run: docker compose --profile core logs --tail 3000 > scenario-batch-stack-logs.txt 2>&1
      - name: Keep the run manifests and the stack logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenario-batch-${{ github.run_id }}
          path: |
            .scenario-runs/batch/
            scenario-batch-stack-logs.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
